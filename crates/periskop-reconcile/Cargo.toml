[package]
name = "periskop-reconcile"
description = "Joins what the code declares against what actually ran, and derives the findings neither source could produce alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
periskop-core = { workspace = true }
# The reconciliation mode is a coverage field this crate decides and the report
# only carries. Depending on the report crate for the enum keeps one spelling of
# a contract vocabulary in the workspace; a second copy here would be free to
# drift from the schema in exactly the way the rest of this codebase writes tests
# against.
periskop-report = { workspace = true }
# Events arrive as the collector read them, already validated against the event
# contract. Redefining the type here would mean validating the same records
# twice, against two shapes that are only equal until one of them is edited.
periskop-runtime-collector = { workspace = true }
# The same reasoning for the third source: a `Flow` arrives as the sensor wrote
# it, with its bucket, its process attribution and its scope already checked
# against `schemas/flow.schema.json`. A second copy of the type here would be
# free to disagree with the contract, and the bucket rule that decides which
# traffic may produce a finding is exactly the invariant that must not be
# restated in two places.
periskop-network-sensor = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Tests only, and only for one test: the proof that a derived finding can be
# produced from a real scanner run rather than from a hand built point. A
# hand built point is what let target_drift pass its unit tests for a whole
# phase while the pipeline could not produce a single one, so the proof has to
# start at source code and the real rule files. Nothing in the shipped crate
# depends on the scanner, and the arrow still points the other way.
periskop-static-scanner = { workspace = true }
