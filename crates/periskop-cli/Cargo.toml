[package]
name = "periskop-cli"
description = "Command line interface. The only binary target in the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "periskop"
path = "src/main.rs"

# The one switch that puts a kernel side program object into the shipped binary.
#
# It forwards and decides nothing: `periskop-network-sensor` owns the feature and
# ADR-014 §4 owns the reason the loader sits behind one. What this line buys is a
# name at the level somebody actually builds. `[[bin]]` lives here (ADR-001), so
# without it there was no way to ask for a `periskop` that can load anything, and
# `-p periskop-cli --all-features` quietly meant "no loader" while
# `--workspace --all-features` meant the opposite.
#
# That gap was not theoretical. The F4 kernel gate ran under `-p periskop-cli`
# with no feature named, so it exercised the no-loader build on a machine that
# had a kernel, a verified object and root, and reported `loader_not_built`. The
# gate was right and the command was wrong.
[features]
ebpf-loader = ["periskop-network-sensor/ebpf-loader"]

[dependencies]
periskop-core = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
# The reading half of the flow contract, for the same reason the collector is a
# dependency: `--flows` hands the scan records the sensor wrote, and they are
# read back through the component that owns that half of the contract rather
# than through a second copy of the shape.
periskop-network-sensor = { workspace = true }
# The masking proxy. A library dependency and not a second executable: ADR-001
# fixes one `[[bin]]` for the whole workspace, and `periskop proxy` is a
# subcommand of it. `tests/command_surface.rs` fails if that ever stops being true.
periskop-proxy = { workspace = true }
periskop-reconcile = { workspace = true }
periskop-report = { workspace = true }
# The reading half of the hook contract. A binary dependency since F2-L: the
# scan reads the event stream back through the component that owns that half of
# the contract, so the same code path serves the pipeline and the gate test.
periskop-runtime-collector = { workspace = true }
periskop-static-scanner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Reading `periskop-policy.toml`. Already a workspace dependency (the static
# scanner reads its rule files with it), so this is a wiring line rather than a
# dependency decision: K-25 requires an ADR for a new dependency, and this one
# was decided when the rule loader took it.
toml = { workspace = true }
# Only the signing command touches it, and only for the buffer a private key
# file is read into. The key type itself clears its own copy (ADR-015).
zeroize = { workspace = true }

# The runtime `periskop proxy` serves on. Promoted from `[dev-dependencies]`
# when the command stopped being a vault opener and started being the proxy: the
# listener is a `hyper` server and `hyper` needs a reactor. A wiring line rather
# than a dependency decision (K-25), because `periskop-proxy` already takes
# `tokio` from the same workspace entry and this binary is the only way anybody
# runs it. It was a test-only dependency for exactly as long as the shipped
# binary could not serve a request, which is the state this promotion ends.
tokio = { workspace = true }

[dev-dependencies]
periskop-static-scanner = { workspace = true }
