[package]
name = "periskop-cli"
description = "Command line interface. The only binary target in the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "periskop"
path = "src/main.rs"

[dependencies]
periskop-core = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
periskop-report = { workspace = true }
periskop-static-scanner = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
periskop-static-scanner = { workspace = true }
# Test only, and deliberately not a dependency of the binary. The F2 gate test
# reads the hook's event stream back through the component that owns that half
# of the contract; letting the test parse the JSON Lines itself would prove the
# test could read them, not that periskop can.
periskop-runtime-collector = { workspace = true }
