[workspace]
resolver = "2"
members = [
    "crates/periskop-core",
    "crates/periskop-static-scanner",
    "crates/periskop-report",
    "crates/periskop-cli",
    "crates/periskop-runtime-collector",
    "crates/periskop-reconcile",
    "crates/periskop-network-sensor",
    # The eBPF loader is a workspace member even though nothing depends on it by
    # default (ADR-014: it hangs off `periskop-network-sensor` behind an off by
    # default feature). Membership is what makes `cargo build --workspace` and
    # `cargo test --workspace` compile and exercise it on every platform,
    # including the macOS machine this repository is developed on. ADR-014 listed
    # a feature that nothing builds as a negative consequence, "the exception
    # crate quietly rots"; this line is what prevents it.
    "crates/periskop-ebpf-loader",
    "crates/periskop-proxy",
]

# Every crate ADR-001 lists is now a member. The list above is the whole of it.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/yusufornek/periskop"
authors = ["periskop contributors"]

[workspace.dependencies]
# Detection layer B's single pass scan (ADR-004, ADR-016 section 1's table). One
# automaton over the whole organization word list, built once per policy load and
# frozen for the life of a request (ADR-010 section 4), because rebuilding it mid
# stream would change what a half emitted alias matches against.
aho-corasick = "1.1"
periskop-core = { path = "crates/periskop-core" }
periskop-static-scanner = { path = "crates/periskop-static-scanner" }
periskop-report = { path = "crates/periskop-report" }
periskop-runtime-collector = { path = "crates/periskop-runtime-collector" }
periskop-reconcile = { path = "crates/periskop-reconcile" }
periskop-network-sensor = { path = "crates/periskop-network-sensor" }
periskop-ebpf-loader = { path = "crates/periskop-ebpf-loader" }
periskop-proxy = { path = "crates/periskop-proxy" }

# The masking vault's key derivation (ADR-007 "Anahtar türetme"). Argon2id is the
# decision, not a preference: a memory hard function is what keeps a stolen vault
# file out of reach of GPU and ASIC guessing. Default features are off because the
# only thing this workspace needs is the raw derivation; `password-hash` brings a
# PHC string encoder nothing here writes, and `rand` a salt generator that would
# be a second entropy path beside `getrandom`.
argon2 = { version = "0.5", default-features = false, features = [
    "alloc",
    "zeroize",
] }
blake3 = "1.5"
# The vault's record cipher (ADR-007 D-14 revision, K-17). XChaCha20-Poly1305 and
# not AES-GCM: the 192 bit nonce is what lets every record draw a fresh random
# nonce with no counter to roll back, and the cipher is constant time in software
# on machines with no AES instructions.
chacha20poly1305 = { version = "0.10", default-features = false, features = [
    "alloc",
] }
clap = { version = "4.5", features = ["derive"] }
# Report signing (ADR-015). Default features are switched off deliberately:
# `fast` pulls in precomputed tables that only buy signing throughput, and this
# workspace signs one document per run.
ed25519-dalek = { version = "2.2", default-features = false, features = [
    "std",
    "zeroize",
] }
# The operating system's entropy source. Signing key generation is the only
# caller; nothing else in this workspace is allowed to be non-deterministic.
getrandom = "0.3"
# Key separation inside the vault (ADR-007, ADR-016 section 2). One passphrase
# derives one master key; every key used for a purpose is expanded from it with a
# purpose label, so a key that leaks leaks one purpose. Written by hand it would
# be hand written crypto, which CLAUDE.md forbids.
hkdf = "0.12"
# The vault file's integrity chain (ADR-007 "3. Dosya bütünlüğü", ADR-016 section
# 2). Already in this tree as `hkdf`'s own dependency; named here because the
# chain calls it directly and a crate this workspace uses on purpose has to be a
# line somebody decided to write.
hmac = "0.12"
# The proxy's own HTTP surface, server half (ADR-004) and client half (ADR-016
# section 3). One stack for both directions: a second HTTP implementation would
# mean two parsers disagreeing about the same request on the two sides of the
# component that is supposed to mediate it.
hyper = { version = "1.5", default-features = false, features = [
    "server",
    "client",
    "http1",
] }
# What hyper 1.0 moved out of its own core (ADR-016 section 3): the tokio
# adapters, the connection server loop and the pooling client. Not a new
# maintainer and not a new audit surface, which is the whole reason the ADR let
# them in without a separate decision.
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
    "server",
    "http1",
    "client-legacy",
] }
http-body-util = "0.1"
# TLS to the provider. `ring` rather than `aws-lc-rs`, and this line is the
# per-target build attempt ADR-016 section 3 said the choice had to wait for:
# `aws-lc-rs` wants `cmake` and, on some targets, `nasm`, which ADR-002's cross
# compilation story pays for on every host. `ring` builds with the `cc` the ADR
# already budgeted. Recorded here rather than in the ADR because the ADR fixed
# the stack and left the provider to packaging.
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
    "native-tokio",
] }
# `native-tokio` above is what pulls `rustls-native-certs` in, which is the root
# store ADR-016 section 3 chose over an embedded list: the trust decision belongs
# to the operating system the organization administers, not to periskop's release
# calendar. Named through the feature rather than as a direct dependency so that
# the version the connector was built against and the version this manifest asks
# for cannot drift apart.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
ignore = "0.4"
# Detection layer A's pattern engine (ADR-016 section 1). Chosen for its linear
# time guarantee rather than for its popularity: the proxy scans attacker chosen
# text, and a backtracking engine turns one carefully written prompt into a hang
# of a fail closed component, which is every LLM call in the organization
# stopping. A hand written engine was rejected in the same section.
regex = "1.11"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The hash HKDF runs over (ADR-016 section 2). Named rather than swapped for the
# `blake3` already in this list: ADR-007 fixes HKDF-SHA256 by name, and changing a
# decided primitive for the sake of one fewer dependency would supersede an ADR
# with no measurement behind it.
sha2 = "0.10"
thiserror = "2.0"
# The proxy's runtime (ADR-004). Deliberately not `features = ["full"]`: the
# proxy needs sockets, a scheduler, timers and a mutex, and `full` would add a
# process spawner and a signal handler to the one component in this workspace
# that holds vault keys and unmasked request bodies.
tokio = { version = "1.41", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    "sync",
    "macros",
] }
toml = "0.9"
streaming-iterator = "0.1"
# Canonical composition of identity inputs (ADR-017, `data-model.md` section 2).
# Two spellings of the same text must not become two identities: a Turkish symbol
# name written as composed `é` and as `e` plus a combining accent looks identical
# on screen and hashes differently, so a call declared in one file and observed by
# a hook would fail to reconcile with nothing in the report to say why. Hand
# writing NFC is not the cheaper option: it needs the Unicode composition and
# canonical ordering tables, which is a data set that has to track every Unicode
# release, and getting it subtly wrong reintroduces exactly the divergence the
# normalisation exists to remove.
unicode-normalization = "0.1"
# Clears private key bytes from the buffers this workspace owns. The signing key
# type from `ed25519-dalek` clears itself on drop; the seed and the text form of
# a key file are ours, so clearing them is ours too.
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Silent failure is the defect class this product exists to expose. Treating these
# as errors keeps the codebase honest about its own error paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
