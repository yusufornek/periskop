[workspace]
resolver = "2"
members = [
    "crates/periskop-core",
    "crates/periskop-static-scanner",
    "crates/periskop-report",
    "crates/periskop-cli",
    "crates/periskop-runtime-collector",
    "crates/periskop-reconcile",
    "crates/periskop-network-sensor",
]

# Crates designed but not yet implemented. They join the workspace in their own
# phase rather than sitting here empty:
#   periskop-proxy

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/yusufornek/periskop"
authors = ["periskop contributors"]

[workspace.dependencies]
periskop-core = { path = "crates/periskop-core" }
periskop-static-scanner = { path = "crates/periskop-static-scanner" }
periskop-report = { path = "crates/periskop-report" }
periskop-runtime-collector = { path = "crates/periskop-runtime-collector" }
periskop-reconcile = { path = "crates/periskop-reconcile" }
periskop-network-sensor = { path = "crates/periskop-network-sensor" }

blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
streaming-iterator = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Silent failure is the defect class this product exists to expose. Treating these
# as errors keeps the codebase honest about its own error paths.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
