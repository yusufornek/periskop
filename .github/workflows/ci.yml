name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  schemas:
    name: Schema contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates every example, and for negative examples also checks that the
      # rejection came from the rule it was written to exercise. An example that
      # fails for the wrong reason is a bug the exit code alone would hide.
      #
      # The runner also fails when it finds no example at all. Its counts come
      # from a directory walk, so a moved examples tree would have printed
      # "0 example(s) checked, 0 failure(s)" and exited zero, which is the shape
      # CLAUDE.md O6b forbids: a gate that cannot find its work must fail.
      - name: Validate examples against schemas
        run: npm run validate:schemas

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain file is the single source for channel and components.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # Features here are additive, so linting with all of them on covers the
      # default build as well as the code the default build leaves out.
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # PERISKOP_REQUIRE_PROOF turns a skipped F2 gate into a failure. Without it
      # a runner with no python3 records `status: skipped` in target/f2-proof.json
      # and still reports green, so a gate that never ran would be indistinguishable
      # from one that passed. Continuous integration is the place that switch is
      # meant to be on; see crates/periskop-cli/tests/proof.rs.
      - name: Tests
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: cargo test --workspace

      # The default build leaves the ebpf loader out, so its tests run nowhere
      # unless they are asked for by name. One of them reads the loader crate's
      # own sources to keep the unsafe exception from spreading, and a guard
      # that only runs locally guards nothing.
      - name: Tests with every feature on
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: cargo test --workspace --all-features

      # periskop scans its own repository. If the tool cannot run on the codebase
      # that produces it, that is worth finding out here rather than from a user.
      #
      # The exit code alone used to close less than it looked like it did. A
      # broken rule file and an uncompilable query both reach it, because they
      # become a failing `engine.rule-set-loaded` hit; a rule set that loads
      # nothing at all did not, because the loader has nothing to complain about,
      # and `scan.rs` now records that case for the same reason. The report is
      # read here as well as the status, so that a run which walked no file and
      # loaded no rule cannot report a clean repository (CLAUDE.md O6b).
      - name: Scan this repository
        run: |
          cargo run --quiet -p periskop-cli -- scan . --rules rules --json > /tmp/self-scan.json
          python3 - <<'CHECK'
          import json, sys
          report = json.load(open("/tmp/self-scan.json"))
          coverage = report["coverage"]
          if coverage["parsed_files"] < 1:
              sys.exit("the self scan parsed no file, so nothing here was examined")
          rules = [hit for hit in report["policy_ref"]["rule_hits"]
                   if hit["rule_id"] == "engine.rule-set-loaded"]
          if rules:
              sys.exit(f"the rule set did not load cleanly: {rules!r}")
          print(f"parsed {coverage['parsed_files']} files, {len(report['findings'])} findings")
          CHECK

      # The emitted report is validated against the shipped contract. A schema
      # that only ever sees hand written examples drifts from what the tool
      # actually writes.
      #
      # Every fixture tree, not one. `rules/` carries four languages and this gate
      # ran on the Python fixtures alone, so the report shape produced for Go,
      # Java and TypeScript was validated nowhere: a coverage entry or a finding
      # field that only one of those grammars can produce would have shipped
      # unchecked. The loop is guarded because a glob that matches nothing is the
      # shape O6b is about, and the language list is derived from `rules/` so that
      # a fifth language cannot be added with no fixtures behind it.
      #
      # `--max-unparsed-ratio 0` is the coverage exit code, which had no caller
      # anywhere in this file. It belongs on the fixtures rather than on the
      # repository above: these trees are all source in a language with a grammar,
      # so zero is the true answer and any drift from it means a grammar stopped
      # reading a file it used to read. Over the repository the same number would
      # be dominated by documents and manifests no grammar reads, and the gate
      # would be a threshold nobody could justify.
      - name: Report conforms to the contract
        run: |
          FIXTURES=crates/periskop-static-scanner/fixtures
          for RULE_DIR in rules/*/; do
            LANGUAGE="$(basename "$RULE_DIR")"
            # The proxy's masking rules are not a scanner language.
            if [ "$LANGUAGE" = masking ]; then continue; fi
            test -d "$FIXTURES/$LANGUAGE"
          done
          COVERED=0
          for FIXTURE in "$FIXTURES"/*/; do
            LANGUAGE="$(basename "$FIXTURE")"
            cargo run --quiet -p periskop-cli -- scan "$FIXTURE" \
              --rules rules --max-unparsed-ratio 0 --json > "/tmp/report-$LANGUAGE.json"
            npx --no-install ajv validate --spec=draft2020 -c ajv-formats --strict=false \
              -s schemas/report.schema.json \
              -r schemas/finding.schema.json \
              -r schemas/coverage-statement.schema.json \
              -d "/tmp/report-$LANGUAGE.json"
            COVERED=$((COVERED + 1))
          done
          echo "validated $COVERED fixture trees"
          test "$COVERED" -ge 4

      # Surfaces the detection numbers in the job log. The test itself already
      # fails on an uncatalogued miss; this is so a reviewer can see the score
      # without digging through an artifact.
      - name: Detection benchmark
        run: |
          cargo test -p periskop-cli --test benchmark
          cat target/benchmark.json

      # F3's reconciliation numbers, printed for the same reason. This artefact
      # records what was not measured as well as what was: meets_minimum_sample
      # is false at eight flows against a floor of two hundred, and fp_rate is
      # null with the reason beside it. A reviewer who cannot see those two
      # fields in the log has no way to tell a refused measurement from a
      # missing one.
      - name: Reconciliation benchmark
        run: |
          cargo test -p periskop-cli --test reconcile_benchmark
          cat target/reconcile-benchmark.json

      # The F4 proxy gate. Same reason for the environment variable: a run that
      # skipped the gate did not pass it. The artefact separates what it proves
      # from what it does not, and printing it here keeps the second list from
      # living only on the machine that produced the file.
      - name: F4 proxy gate proof
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-cli --test proof_f4
          cat target/f4-proof.json

      # The vault plaintext gate, which is F4 exit criterion 3. It runs both KDF
      # profiles and a skipped profile is a failure rather than a smaller run.
      - name: Vault plaintext gate
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-proxy --test vault_no_plaintext
          cat target/f4-vault-no-plaintext-proof.json

      # The F3 gate itself. PERISKOP_REQUIRE_PROOF is set for the reason it is
      # set on the test steps: a run that skipped the gate did not pass it. The
      # artefact carries a caveat saying the eBPF capture path did not run, and
      # printing it here is what keeps that sentence from living only on the
      # machine that produced the file.
      - name: F3 gate proof
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-cli --test proof_f3
          cat target/f3-proof.json

      # Two builds of the same tree must agree byte for byte, in every language
      # the rule set carries. This ran on the Python fixtures alone, so a
      # nondeterminism that only a Go, Java or TypeScript rule family could
      # produce (an unordered map in a query walk, a hash seeded per process) had
      # nothing looking for it. Compared as bytes rather than as parsed documents
      # too: two files that parse to the same object can still differ in key
      # order, and a report is promised diffable.
      - name: Report is reproducible
        run: |
          COMPARED=0
          for FIXTURE in crates/periskop-static-scanner/fixtures/*/; do
            LANGUAGE="$(basename "$FIXTURE")"
            cargo run --quiet -p periskop-cli -- scan "$FIXTURE" --rules rules --json > /tmp/a.json
            cargo run --quiet -p periskop-cli -- scan "$FIXTURE" --rules rules --json > /tmp/b.json
            python3 - "$LANGUAGE" <<'CHECK'
          import json, sys
          language = sys.argv[1]
          first, second = open("/tmp/a.json").read(), open("/tmp/b.json").read()
          if first == second:
              sys.exit(0)
          # The envelope carries the wall clock, which is the one field two runs
          # are allowed to disagree on. Everything else is the report.
          a, b = json.loads(first), json.loads(second)
          a.pop("envelope"), b.pop("envelope")
          sys.exit(0 if a == b else f"two scans of the {language} fixtures disagreed")
          CHECK
            COMPARED=$((COMPARED + 1))
          done
          echo "compared $COMPARED fixture trees"
          test "$COMPARED" -ge 4

  # F4 exit criterion 1, and the only job in this file that can close it.
  #
  # Everything else here runs unprivileged, and the eBPF capture path cannot be
  # observed from there: it needs a kernel with BTF, a process holding CAP_BPF
  # and CAP_PERFMON, and a kernel side object that no macOS development machine
  # can build. ADR-014 deferred the loader three times partly on the belief that
  # no gate could ever see the code; K-28 measured a hosted runner and found that
  # belief wrong, and this job is what that measurement was for.
  #
  # It is deliberately fail closed. There is no `continue-on-error` and no
  # `|| true` anywhere in it (CLAUDE.md O6b): a run that cannot build the object,
  # cannot load the programs, or produces an artefact that does not say `proved`
  # fails the workflow. A phase criterion that a red job could leave green is a
  # criterion nobody is checking.
  kernel:
    name: Kernel capture (privileged Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Printed, not asserted. The assertions are in the Rust below; this is so
      # that a reader of a failed run can see what the machine offered without
      # rerunning anything. These are the same three facts the kernel-probe
      # workflow measured for K-28.
      - name: What this runner offers
        run: |
          uname -a
          echo "BTF: $(stat -c %s /sys/kernel/btf/vmlinux) bytes"
          grep -E 'CapEff' /proc/self/status
          sudo grep -E 'CapEff' /proc/self/status

      - uses: Swatinem/rust-cache@v2

      # The linker for the kernel target. It is not a cargo dependency of
      # anything: it is a host tool the object's build invokes, which is exactly
      # why ADR-014 §8 records it as a build time cost rather than as a
      # dependency of the shipped binary.
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      # The toolchain comes from crates/periskop-ebpf-object/rust-toolchain.toml,
      # which pins a dated nightly separately from the workspace's stable pin.
      # rustup installs it on first use, and the version is printed so a failure
      # caused by moving that pin is visible in the log rather than inferred.
      - name: Build the kernel side object
        working-directory: crates/periskop-ebpf-object
        run: |
          rustc --version
          cargo build --release
          ls -l target/bpfel-unknown-none/release/periskop-ebpf-object

      # The formatting and lint gates for this crate, which had none.
      #
      # `cargo fmt --all --check` and `cargo clippy --workspace ...` in the Rust
      # job scan the workspace rooted at the repository root. This package
      # declares an empty `[workspace]` table and is therefore its own workspace
      # root, for the three reasons its manifest gives, so it cannot enter that
      # scan at all: no path from the root manifest reaches it. The only thing
      # that touched it in this file was `cargo build --release` above, and a
      # build says nothing about the lints. Clippy's raw pointer lints are the
      # ones that matter here, because every helper call in `main.rs` is a read
      # into kernel memory and the crate is the one place in the tree that cannot
      # be exercised by a test on any development machine.
      #
      # The command is the one `src/main.rs` already documents, moved from a
      # comment nobody runs into a step that fails the job. `RUSTC_BOOTSTRAP=1`
      # is what lets a stable toolchain accept the `build-std` in
      # `.cargo/config.toml`; it is redundant under the dated nightly this
      # directory pins and is kept so that the line a developer runs and the line
      # continuous integration runs are the same line. `rustfmt` and `clippy` are
      # in that toolchain file's components for this step, and its `profile =
      # "minimal"` would otherwise leave both uninstalled.
      #
      # Chained with `&&` so that a failing format check cannot be passed over by
      # a later success (CLAUDE.md O6b).
      - name: Formatting and lints for the kernel side object
        working-directory: crates/periskop-ebpf-object
        env:
          RUSTC_BOOTSTRAP: 1
        run: |
          cargo fmt --check \
            && cargo clippy --release -- -D warnings

      # The object's existence is what makes the loader a loader. Checked here
      # rather than trusted, because every later step would otherwise fall back
      # to the honest-but-useless `loader_not_built` path and still report green.
      - name: The object exists and is not empty
        run: |
          OBJ="$PWD/crates/periskop-ebpf-object/target/bpfel-unknown-none/release/periskop-ebpf-object"
          test -s "$OBJ"
          echo "PERISKOP_EBPF_OBJECT=$OBJ" >> "$GITHUB_ENV"

      # The three gates, with the object compiled in, so this is the first place
      # in the repository where the loader's Linux code is compiled at all. The
      # development machine is macOS and never sees it (ADR-014 §8).
      - name: Formatting, lints and tests with the loader compiled in
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features -- --test-threads=4

      # The tests that need real authority. `--test-threads=1` is required and
      # not a preference: one of them drops this process's capabilities, which is
      # a change to the whole process, so a concurrent test would read them at an
      # unpredictable moment.
      #
      # Both packages, because the sensor carries one of these too: it has been
      # marked and unrunnable through three milestones waiting for a loader, and
      # this is the first job that can run it.
      #
      # The count is asserted because `-- --ignored` exits zero when it finds
      # nothing to run, and these are the only tests in the repository that can
      # only run here: a rename, a moved `#[ignore]` or a filter that stopped
      # matching would leave this step green while the privileged path went
      # unexercised for as long as anybody cared to look (CLAUDE.md O6b).
      # pipefail is set because the assertion reads a teed log and bash would
      # otherwise report the exit code of `tee`.
      - name: Loader tests that need a real kernel
        run: |
          set -o pipefail
          sudo -E env "PATH=$PATH" cargo test -p periskop-ebpf-loader --all-features \
            -- --ignored --test-threads=1 | tee /tmp/ignored-loader.txt
          sudo -E env "PATH=$PATH" cargo test -p periskop-network-sensor --all-features \
            -- --ignored --test-threads=1 | tee /tmp/ignored-sensor.txt
          python3 - <<'CHECK'
          import re, sys
          for path, package in (("/tmp/ignored-loader.txt", "periskop-ebpf-loader"),
                                ("/tmp/ignored-sensor.txt", "periskop-network-sensor")):
              log = open(path).read()
              results = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored", log)
              if not results:
                  sys.exit(f"{package}: no test result line, so nothing here reported a run")
              passed = sum(int(row[0]) for row in results)
              skipped = sum(int(row[2]) for row in results)
              if passed == 0:
                  sys.exit(f"{package}: --ignored matched no test, so this step proved nothing")
              if skipped:
                  sys.exit(f"{package}: {skipped} tests were still skipped under --ignored")
              print(f"{package}: {passed} privileged tests ran, skipped 0")
          CHECK
        env:
          RUSTFLAGS: -D warnings

      # The gate itself. PERISKOP_REQUIRE_KERNEL_PROOF is set only here, and it
      # turns every path in proof_f4_kernel.rs that would record a skip into a
      # failure.
      #
      # `--all-features` is load bearing and was missing for one run. Without it
      # cargo rebuilds `periskop-network-sensor` with `ebpf-loader` off, the test
      # binary carries no loader, and the gate reports `loader_not_built` on a
      # machine that has BTF, root and an object the kernel would have accepted.
      # The failure looked like a kernel problem and was a command line one.
      - name: F4 kernel gate
        run: |
          sudo -E env "PATH=$PATH" PERISKOP_REQUIRE_KERNEL_PROOF=1 \
            cargo test -p periskop-cli --all-features --test proof_f4_kernel
          cat target/f4-kernel-proof.json

      # A passing test is not the claim; the artefact is. This is the line that
      # makes a missing or downgraded artefact fail the job, so that a gate which
      # ran and could not prove anything cannot be read as one that did.
      - name: The artefact says proved
        run: |
          python3 - <<'CHECK'
          import json, sys
          path = "target/f4-kernel-proof.json"
          try:
              proof = json.load(open(path))
          except Exception as error:
              sys.exit(f"{path} was not produced or is not readable: {error}")
          if proof.get("status") != "proved":
              sys.exit(f"F4 exit criterion 1 is open: status={proof.get('status')!r}, reason={proof.get('reason')!r}")
          if proof.get("capture") != "ebpf":
              sys.exit(f"the observation did not come through eBPF: capture={proof.get('capture')!r}")
          if not proof.get("proves") or not proof.get("does_not_prove"):
              sys.exit("the artefact must state both what it proves and what it does not")
          # The payload check reads a field that has to be *there*. It used to be
          # `if evidence.get("payload_marker_found_in_any_record")`, and a missing
          # evidence block, a renamed field or a run that never searched the
          # records all produced None, which is falsy, which read as "no payload
          # leaked". That is the shape CLAUDE.md O6b forbids: an absent
          # measurement counted as a passing one. proof_f4_kernel.rs asserts the
          # same thing with a hard assert, and this step is what stops the
          # artefact from claiming a search that did not happen.
          evidence = proof.get("evidence")
          if not isinstance(evidence, dict):
              sys.exit(f"the artefact carries no evidence block, so nothing here searched a record: evidence={evidence!r}")
          for field in ("payload_marker_found_in_any_record",
                        "ring_buffer_frames_dropped",
                        "records_the_decoder_refused",
                        "flows_recorded"):
              if field not in evidence:
                  sys.exit(f"the evidence block has no {field}, so this step is reading an artefact from a different gate")
          leaked = evidence["payload_marker_found_in_any_record"]
          if not isinstance(leaked, bool):
              sys.exit(f"payload_marker_found_in_any_record is {leaked!r} and not a boolean, so it is not an answer")
          if leaked:
              sys.exit("payload reached a record")
          # A search over no record proves nothing, exactly as an empty surface
          # list would.
          if not evidence["flows_recorded"]:
              sys.exit("the gate recorded no flow, so the payload search ran over nothing")
          print(f"proved: {len(proof['proves'])} claims, {len(proof['does_not_prove'])} exclusions, "
                f"{evidence['flows_recorded']} flows searched for the payload marker")
          CHECK

      - name: Publish the kernel proof
        uses: actions/upload-artifact@v4
        with:
          name: f4-kernel-proof
          path: target/f4-kernel-proof.json
          if-no-files-found: error

      # ADR-014 §5 requires this crate to have a separate miri or sanitiser
      # target, and it runs here rather than in the main Rust job because this is
      # the job that owns the crate.
      #
      # It used to run with PERISKOP_EBPF_OBJECT set to the empty string, which
      # made `build.rs` leave the `periskop_kernel_object` cfg off, which left
      # `src/syscall.rs` out of the build entirely. `syscall.rs` is the only file
      # in this workspace that steps outside `unsafe_code = "forbid"`. So the one
      # job whose whole purpose is to interpret the exception was interpreting a
      # crate that did not contain it, and it was green for that reason.
      #
      # The object built above is therefore left in place. `under_miri` in
      # `src/lib.rs` fails the job if this line is ever reverted, because a green
      # miri run over a build with no unsafe in it is worse than no miri run: it
      # reads as coverage.
      #
      # Nothing here reaches a kernel, and that used to be written down as a
      # reason this job was pointed at the record decoder rather than at the
      # exception. `src/lib.rs` said the opposite in its own words, that the
      # reason for the job is `syscall`, and the two sentences described two
      # different modules while the code delivered neither: every path in the lib
      # target that reaches `capget` or `capset` runs through `EbpfLoader::open`,
      # and `missing_program` turns each of them back before it gets there. So
      # this step compiled the exception, as `under_miri` insists, and
      # interpreted none of it.
      #
      # Both halves are now real, and the reason they have to be two halves is a
      # property of miri rather than a choice: **miri does not execute foreign
      # functions**, so a test that reached `libc::syscall` would stop the
      # interpreter with an unsupported operation instead of checking anything.
      # What can be interpreted is everything around the call, which is where the
      # defect would be:
      #
      #   * the capability buffer, through `read_capabilities_with` and
      #     `write_capabilities_with` in `src/syscall.rs`. Their tests drive them
      #     with a stand-in that writes as many blocks as the header's version
      #     declares, through the same raw pointer, into the same stack array, so
      #     a `CAP_BLOCKS` that stopped matching that version is an out of bounds
      #     write the interpreter reports. `tests/unsafe_boundary.rs` fails on
      #     every platform if those tests are removed.
      #   * the record decoder, which reads bytes this process did not write and
      #     is the other place an out of bounds read would live.
      #
      # Isolation is off so that the monotonic clock reading in `syscall`'s own
      # tests resolves; it relaxes what the interpreter may ask the host for and
      # changes nothing about what it checks.
      - name: Miri over the loader crate
        run: |
          rustup toolchain install nightly --component miri --profile minimal
          cargo +nightly miri test -p periskop-ebpf-loader --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  # F4 exit criterion 2, and the only job in this file that can close it.
  #
  # The measurement itself has run on every push for several waves, inside
  # `cargo test --workspace` in the Rust job above, and it closed nothing: with no
  # environment declared it wrote `budget_verdict: null`, an empty `measurements`
  # array and `measurement_is_comparable: false`, which is the correct behaviour
  # and not a gate. `perf-budgets.md` section 4 declares exactly one reference
  # environment and forbids publishing a number taken anywhere else, so the
  # criterion needed a job that runs on that environment and says so. This is it.
  #
  # `PERISKOP_PERF_ENVIRONMENT_ID` is a claim this file makes, and the runner
  # checks it rather than trusting it: latency_gate.rs parses the declaration out
  # of perf-budgets.md section 4 and compares it with the machine's own cores,
  # memory, architecture and operating system. Three things therefore fail here
  # rather than passing quietly: an identity this file invents that the document
  # does not declare, a runner class that moved under the declaration, and a
  # measurement over the budget.
  #
  # Fail closed, like the kernel job. No `continue-on-error` and no `|| true`
  # (CLAUDE.md O6b): a run that cannot measure, cannot publish, or publishes a
  # number over the budget fails the workflow. The 150 ms itself is not written
  # here and cannot be relaxed from this file: it lives in the runner, which
  # checks it against docs/05-quality/performance-budgets.md on every tree that
  # carries that document. `docs/` is unpublished, so this checkout is not one of
  # them, and the artefact says so in `budget_source`.
  latency:
    name: Added latency budget (reference environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ajv, for validating the perf-budgets.json this job produces. The schema
      # has only ever seen hand written examples; this is the first thing that
      # validates what the runner actually writes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: Swatinem/rust-cache@v2

      # Printed, not asserted. The assertions are in the Rust, which compares
      # these same facts with the declaration; this is so that a reader of a
      # failed run can see what the machine offered without rerunning anything.
      # If the hosted runner class ever moves, this block is the evidence for the
      # correction perf-budgets.md section 4 then needs.
      - name: What this runner offers
        run: |
          uname -a
          echo "cores: $(nproc)"
          grep -m1 'model name' /proc/cpuinfo
          grep MemTotal /proc/meminfo
          grep -E '^(ID|VERSION_ID)=' /etc/os-release

      # The whole test binary rather than one named test, for the reason O6b
      # gives: a gate pinned to a single name stops covering everything added
      # beside it. --test-threads=4 matches the workspace runs; the other tests in
      # this binary are microsecond scale assertions over parsed documents, and
      # the measurement discards ten warmup requests per phase before it times
      # anything.
      - name: Added latency gate on the reference environment
        env:
          PERISKOP_PERF_ENVIRONMENT_ID: ci-linux-4vcpu
        run: |
          cargo test -p periskop-proxy --test latency_gate -- --test-threads=4 \
            && cat target/f4-latency-gate.json \
            && cat perf-budgets.json

      - name: perf-budgets.json conforms to the contract
        run: |
          npx --no-install ajv validate --spec=draft2020 -c ajv-formats --strict=false \
            -s schemas/perf-budgets.schema.json \
            -d perf-budgets.json

      # A passing test is not the claim; the artefact is. This is the line that
      # makes a refused measurement fail the job, so that a run which measured
      # nothing it was allowed to publish cannot be read as one that passed the
      # budget.
      - name: The artefact carries a verdict
        run: |
          python3 - <<'CHECK'
          import json, sys
          path = "target/f4-latency-gate.json"
          try:
              gate = json.load(open(path))
          except Exception as error:
              sys.exit(f"{path} was not produced or is not readable: {error}")
          declared, reference = gate.get("declared_environment_id"), gate.get("reference_environment_id")
          if declared != reference:
              sys.exit(f"this job declared {declared!r} and perf-budgets.md section 4 declares {reference!r}: nothing measured here is comparable with the budget")
          if not gate.get("runner_matches_declaration"):
              sys.exit(f"the runner is not the declared environment: {gate.get('runner_mismatches')!r}")
          if gate.get("status") != "measured" or not gate.get("measurement_is_comparable"):
              sys.exit(f"F4 exit criterion 2 is open: status={gate.get('status')!r}")
          verdict = gate.get("budget_verdict") or {}
          if verdict.get("verdict") != "pass":
              sys.exit(f"the added latency budget was not met: {verdict!r}")
          if not gate.get("measurements"):
              sys.exit("no measurement was written into the series")
          if not gate.get("perf_budgets_json_written"):
              sys.exit("perf-budgets.json was not written, so the threshold file records no run")
          print(f"added p95 latency {verdict['value_ms']} ms against a budget of {verdict['limit_ms']} ms from {gate['budget_source']['document']}")
          CHECK

      # if: always() so that a refused or failing measurement is still readable
      # afterwards. It does not soften the gate: the steps above have already
      # decided the job, and this one only carries their evidence out.
      - name: Publish the latency gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f4-latency-gate
          path: |
            target/f4-latency-gate.json
            perf-budgets.json
          if-no-files-found: error

  # The two hooks are the second detection source, and neither is compiled by
  # cargo. They carry their own blake3, written out because a hook may not add a
  # dependency to somebody else's interpreter, and the whole point of that code
  # is that python, node and the engine derive the same egress_event_id. Nothing
  # checks that unless these suites run.
  hooks-python:
    name: Python runtime hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hook is pure standard library, so the runner's interpreter is the
      # dependency list. Printed because which one it was matters when a failure
      # is version specific. The declared floor is python 3.9 and this job does
      # not exercise it; that is a gap, not a claim.
      - name: Show interpreter
        run: python3 --version

      # `unittest discover` exits zero when it discovers nothing, so a moved test
      # directory or a renamed file would leave this job green with the hook's
      # whole suite unrun (CLAUDE.md O6b). `-v` puts the count on stderr and the
      # floor below is what makes it load bearing.
      - name: Tests
        working-directory: hooks/python
        run: |
          set -o pipefail
          python3 -m unittest discover -v 2>&1 | tee /tmp/hook-python-tests.txt
          python3 - <<'CHECK'
          import re, sys
          log = open("/tmp/hook-python-tests.txt").read()
          match = re.search(r"^Ran (\d+) tests? in ", log, re.MULTILINE)
          if not match:
              sys.exit("unittest printed no run count, so nothing here reported a run")
          ran = int(match.group(1))
          if ran == 0:
              sys.exit("unittest discovered no test, so this step proved nothing")
          skipped = len(re.findall(r"\.\.\. skipped", log))
          if skipped:
              sys.exit(f"{skipped} tests were skipped; this suite is pure standard library and skips nothing")
          print(f"{ran} hook tests ran, skipped 0")
          CHECK

  hooks-node:
    name: Node runtime hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hooks/node/package-lock.json

      - name: Install
        working-directory: hooks/node
        run: npm ci

      - name: Types
        working-directory: hooks/node
        run: npx tsc --noEmit

      - name: Build
        working-directory: hooks/node
        run: npx tsc

      # The suite runs against the emitted JavaScript rather than the sources,
      # which is what the interpreter loads through --require at run time.
      #
      # The count is read for the reason O6b gives, and it is not hypothetical
      # here: `node --test` exits zero over a file that declares no test, so a
      # build that emitted an empty suite, or a rename that left the glob matching
      # one stale file, would leave this job green with the hook's whole suite
      # unrun. The Python job next door has had this floor since it was written.
      - name: Tests
        working-directory: hooks/node
        run: |
          set -o pipefail
          node --test --test-reporter=tap dist/*.test.js 2>&1 | tee /tmp/hook-node-tests.txt
          python3 - /tmp/hook-node-tests.txt "hooks/node" <<'CHECK'
          import re, sys
          path, package = sys.argv[1], sys.argv[2]
          log = open(path).read()
          def total(name):
              found = re.findall(rf"^# {name} (\d+)$", log, re.MULTILINE)
              if not found:
                  sys.exit(f"{package}: the runner printed no '# {name}' line, so nothing here reported a run")
              return sum(int(value) for value in found)
          passed, failed, skipped = total("pass"), total("fail"), total("skipped")
          if failed:
              sys.exit(f"{package}: {failed} tests failed")
          if passed == 0:
              sys.exit(f"{package}: the runner found no test to run, so this step proved nothing")
          if skipped:
              sys.exit(f"{package}: {skipped} tests were skipped; this suite skips nothing")
          print(f"{package}: {passed} tests ran, skipped 0")
          CHECK

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      # The smoke tests drive the real binary, so the engine is built first.
      - name: Build the engine
        run: cargo build -p periskop-cli

      - name: Install
        working-directory: packages/mcp-server
        run: npm ci

      - name: Types
        working-directory: packages/mcp-server
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/mcp-server
        run: npx tsc

      # Both sides pass their own tests without agreeing on the wire. This is
      # where a renamed field or a framing mismatch surfaces.
      #
      # The glob is deliberate. Naming one file here meant that every suite
      # added later ran on a developer machine and nowhere else, which is the
      # same defect this project exists to report: a check that looks like it
      # covers something and does not.
      #
      # And the count is read, for the same reason: the glob covers whatever is
      # emitted, and `node --test` exits zero over a file with no test in it, so
      # the exit code alone cannot tell a suite that ran from one that was not
      # built (CLAUDE.md O6b).
      - name: Tests
        working-directory: packages/mcp-server
        run: |
          set -o pipefail
          node --test --test-reporter=tap dist/*.test.js 2>&1 | tee /tmp/mcp-tests.txt
          python3 - /tmp/mcp-tests.txt "packages/mcp-server" <<'CHECK'
          import re, sys
          path, package = sys.argv[1], sys.argv[2]
          log = open(path).read()
          def total(name):
              found = re.findall(rf"^# {name} (\d+)$", log, re.MULTILINE)
              if not found:
                  sys.exit(f"{package}: the runner printed no '# {name}' line, so nothing here reported a run")
              return sum(int(value) for value in found)
          passed, failed, skipped = total("pass"), total("fail"), total("skipped")
          if failed:
              sys.exit(f"{package}: {failed} tests failed")
          if passed == 0:
              sys.exit(f"{package}: the runner found no test to run, so this step proved nothing")
          if skipped:
              sys.exit(f"{package}: {skipped} tests were skipped; this suite skips nothing")
          print(f"{package}: {passed} tests ran, skipped 0")
          CHECK

      # Every contract under schemas/ has had an ajv gate from the start except
      # the MCP tool surface, which had only prose. Four deviations between
      # docs/04-contracts/mcp-tools.md and this package survived for months
      # because nothing compared them: a rule with no gate stays silent when it
      # is broken, which is the defect this product exists to report.
      #
      # The gate derives the surface from the real registerTool list and the real
      # handlers, then validates it against schemas/mcp-tools.schema.json. It is
      # its own step rather than one more file behind the test glob because a
      # gate has to say whether it ran. No --if-present and no || true: a missing
      # schema, an empty registry or an argument type the describer cannot state
      # all exit non zero rather than reporting green (CLAUDE.md O6b).
      - name: Tool surface matches the contract
        working-directory: packages/mcp-server
        run: npm run gate:contract

  # Nothing in this repository has ever asked whether its own dependencies carry
  # a known vulnerability.
  #
  # ADR-015 section 6.1 prints a table of RustSec records and says in the same
  # breath what that table is: "elle bakılmış bir fotoğraf", read once on
  # 2026-08-04 and never again. The ADR files the missing automation as work it
  # created and records that it was not done. This job is that work. It also
  # decides something the ADR left open on purpose: `ed25519-dalek` 3.0.0 was
  # rejected "for today" with the note that the move should be reconsidered once
  # this gate exists.
  #
  # Fail closed, like the kernel and latency jobs. There is no `continue-on-error`
  # and no `|| true` anywhere in it (CLAUDE.md O6b). The gate fails when it finds
  # a vulnerability, and it also fails when it cannot prove it looked: an empty
  # advisory database and an unread lockfile both produce "no findings", which is
  # the exact shape O6b forbids.
  #
  # This gate can turn a commit red that changed nothing, because the advisory
  # database moves on its own. That is the point of it rather than a defect in
  # it. The remedy is a dependency decision, which CLAUDE.md routes through an
  # ADR; it is not an ignore line. There is deliberately no `.cargo/audit.toml`
  # in this tree, so the first exception has to arrive in the same commit as the
  # reasoning for it rather than into a file that is already sitting there empty.
  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # cargo-audit rather than cargo-deny, and the choice is narrower than it
      # looks. The open work is the advisory check; cargo-deny's other checks
      # (licenses, bans, sources) are three more policy surfaces that nobody in
      # this repository has decided yet, and a licence allowlist that does not
      # exist fails on the first run for a reason unrelated to security. Beyond
      # that, cargo-deny needs a `deny.toml` whose `[advisories]` schema has
      # changed shape across releases, and an unknown key there is a hard error;
      # cargo-audit needs no configuration file at all, so there is nothing here
      # that can be silently wrong about its own syntax.
      #
      # The version is a `^0.21` requirement rather than an exact pin: the newest
      # patch of a scanner is the one worth having, while the minor is held
      # because the step below parses this tool's JSON and a shape change under a
      # floating version would be read as "nothing found". `--locked` so the
      # tool's own dependencies come from its lockfile.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.21"

      # Both committed lockfiles. `crates/periskop-ebpf-object` declares an empty
      # `[workspace]` table and is its own workspace root, so no path from the
      # root manifest reaches it and the root lockfile does not describe it; it is
      # the same blind spot the kernel job's formatting and lint step was written
      # to close (ADR-014 section 8).
      #
      # A vulnerability makes cargo-audit itself exit non zero here, before the
      # step below runs. That is the intended outcome and the reason the JSON is
      # teed rather than only redirected: the finding is in the job log even
      # though the reading step never gets to it.
      - name: Advisories against every committed lockfile
        run: |
          set -o pipefail
          cargo audit --json --file Cargo.lock \
            | tee /tmp/audit-workspace.json
          cargo audit --json --file crates/periskop-ebpf-object/Cargo.lock \
            | tee /tmp/audit-ebpf-object.json

      # A zero exit code is not the claim; the report is.
      #
      # Which advisory classes fail this job, and why each answer is what it is:
      #
      #   * **vulnerability: fails.** The reason the job exists.
      #   * **unsound: fails.** A RustSec unsound advisory is a memory safety
      #     defect reachable from safe code. ADR-002 forbids `unsafe` across this
      #     workspace and ADR-015 section 6.2 already records that the dependency
      #     tree's unsafe surface is not zero; accepting an unsound advisory would
      #     put back exactly the class the lint excluded, one level down where the
      #     lint cannot see it.
      #   * **yanked: fails.** The lockfile is committed, so a yanked version is a
      #     withdrawn artefact this repository is still pinning. The fix is a
      #     lockfile update: deterministic, available the same day, and visible in
      #     a diff.
      #   * **unmaintained: does not fail, is printed.** It describes the
      #     maintainer rather than the code; the bytes that ship did not change on
      #     the day the advisory was published. The only remedies available within
      #     a day are replacing a dependency, which CLAUDE.md makes an ADR
      #     decision, or writing an ignore line. A gate whose fastest remedy is an
      #     ignore line teaches people to write ignore lines, and after that it
      #     reports nothing. So it is surfaced on every run and it is the input to
      #     that ADR rather than a substitute for it.
      #   * **notice: does not fail, is printed.** Same reasoning, weaker signal.
      - name: The audit looked at something and says what it found
        run: |
          python3 - <<'CHECK'
          import json, sys

          # Floors, not counts. They answer "did this run read a lockfile at
          # all", so they sit far below today's numbers (185 packages in the
          # workspace lockfile, 31 in the kernel object's) and far above zero. An
          # ordinary dependency removal does not reach them; a missing, empty or
          # mistyped path does.
          LOCKFILES = (("/tmp/audit-workspace.json", "Cargo.lock", 100),
                       ("/tmp/audit-ebpf-object.json",
                        "crates/periskop-ebpf-object/Cargo.lock", 10))

          # Read under both spellings. These keys belong to a tool's output
          # rather than to a contract this repository owns, and a gate that dies
          # on a renamed key is a gate somebody deletes. A key that is absent
          # under every spelling still fails, because that is a report this step
          # cannot read rather than a clean one.
          def field(document, name, where):
              for spelling in (name, name.replace("-", "_")):
                  if spelling in document:
                      return document[spelling]
              sys.exit(f"{where}: no {name} field, so this step is reading a report from a different tool")

          for path, lockfile, floor in LOCKFILES:
              try:
                  report = json.load(open(path))
              except Exception as error:
                  sys.exit(f"{path} was not produced or is not readable: {error}")

              database = field(report, "database", path)
              advisories = field(database, "advisory-count", f"{path} database")
              if advisories < 100:
                  sys.exit(f"{lockfile}: the advisory database holds {advisories} records, so the fetch produced an empty or partial database and every crate would look clean")

              dependencies = field(field(report, "lockfile", path), "dependency-count", f"{path} lockfile")
              if dependencies < floor:
                  sys.exit(f"{lockfile}: {dependencies} packages were audited against a floor of {floor}, so this run did not read the lockfile it was pointed at")

              vulnerabilities = field(report, "vulnerabilities", path)
              found, count = field(vulnerabilities, "found", path), field(vulnerabilities, "count", path)
              if found or count:
                  sys.exit(f"{lockfile}: {count} known vulnerabilities: {vulnerabilities.get('list')!r}")

              warnings = field(report, "warnings", path)
              if not isinstance(warnings, dict):
                  sys.exit(f"{lockfile}: warnings is {warnings!r} and not a map, so nothing here classified anything")

              # Absent means none of that class, which is why these are read with
              # a default while the block above is not: `warnings` itself has to
              # be there, its per class keys do not.
              for fatal in ("unsound", "yanked"):
                  entries = warnings.get(fatal, [])
                  if entries:
                      sys.exit(f"{lockfile}: {len(entries)} {fatal} advisories: {entries!r}")

              tolerated = {kind: len(warnings.get(kind, [])) for kind in ("unmaintained", "notice")}
              print(f"{lockfile}: {dependencies} packages audited against {advisories} advisories, "
                    f"0 vulnerabilities, 0 unsound, 0 yanked, "
                    f"{tolerated['unmaintained']} unmaintained, {tolerated['notice']} notice")
              for kind in ("unmaintained", "notice"):
                  for entry in warnings.get(kind, []):
                      print(f"  {kind}: {entry!r}")
          CHECK

      # What this job does not cover, stated rather than left to be discovered.
      # The two npm lockfiles (packages/mcp-server, hooks/node) carry the only
      # dependencies this project publishes to somebody else's machine, and
      # nothing audits them; `npm audit` is the same class of gate and is filed
      # as open work rather than added here, because it fails on a surface this
      # task did not decide. Recorded in ADR-015 section 6.1.
      - name: What this gate does not answer
        run: |
          echo "audited: Cargo.lock, crates/periskop-ebpf-object/Cargo.lock"
          echo "not audited: packages/mcp-server/package-lock.json, hooks/node/package-lock.json, package-lock.json"
