name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  schemas:
    name: Schema contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Validates every example, and for negative examples also checks that the
      # rejection came from the rule it was written to exercise. An example that
      # fails for the wrong reason is a bug the exit code alone would hide.
      - name: Validate examples against schemas
        run: npm run validate:schemas

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain file is the single source for channel and components.
      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      # Features here are additive, so linting with all of them on covers the
      # default build as well as the code the default build leaves out.
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # PERISKOP_REQUIRE_PROOF turns a skipped F2 gate into a failure. Without it
      # a runner with no python3 records `status: skipped` in target/f2-proof.json
      # and still reports green, so a gate that never ran would be indistinguishable
      # from one that passed. Continuous integration is the place that switch is
      # meant to be on; see crates/periskop-cli/tests/proof.rs.
      - name: Tests
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: cargo test --workspace

      # The default build leaves the ebpf loader out, so its tests run nowhere
      # unless they are asked for by name. One of them reads the loader crate's
      # own sources to keep the unsafe exception from spreading, and a guard
      # that only runs locally guards nothing.
      - name: Tests with every feature on
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: cargo test --workspace --all-features

      # periskop scans its own repository. If the tool cannot run on the codebase
      # that produces it, that is worth finding out here rather than from a user.
      - name: Scan this repository
        run: cargo run --quiet -p periskop-cli -- scan . --rules rules

      # The emitted report is validated against the shipped contract. A schema
      # that only ever sees hand written examples drifts from what the tool
      # actually writes.
      - name: Report conforms to the contract
        run: |
          cargo run --quiet -p periskop-cli -- scan \
            crates/periskop-static-scanner/fixtures/python \
            --rules rules --json > /tmp/report.json
          npx --no-install ajv validate --spec=draft2020 -c ajv-formats --strict=false \
            -s schemas/report.schema.json \
            -r schemas/finding.schema.json \
            -r schemas/coverage-statement.schema.json \
            -d /tmp/report.json

      # Surfaces the detection numbers in the job log. The test itself already
      # fails on an uncatalogued miss; this is so a reviewer can see the score
      # without digging through an artifact.
      - name: Detection benchmark
        run: |
          cargo test -p periskop-cli --test benchmark
          cat target/benchmark.json

      # F3's reconciliation numbers, printed for the same reason. This artefact
      # records what was not measured as well as what was: meets_minimum_sample
      # is false at eight flows against a floor of two hundred, and fp_rate is
      # null with the reason beside it. A reviewer who cannot see those two
      # fields in the log has no way to tell a refused measurement from a
      # missing one.
      - name: Reconciliation benchmark
        run: |
          cargo test -p periskop-cli --test reconcile_benchmark
          cat target/reconcile-benchmark.json

      # The F4 proxy gate. Same reason for the environment variable: a run that
      # skipped the gate did not pass it. The artefact separates what it proves
      # from what it does not, and printing it here keeps the second list from
      # living only on the machine that produced the file.
      - name: F4 proxy gate proof
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-cli --test proof_f4
          cat target/f4-proof.json

      # The vault plaintext gate, which is F4 exit criterion 3. It runs both KDF
      # profiles and a skipped profile is a failure rather than a smaller run.
      - name: Vault plaintext gate
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-proxy --test vault_no_plaintext
          cat target/f4-vault-no-plaintext-proof.json

      # The F3 gate itself. PERISKOP_REQUIRE_PROOF is set for the reason it is
      # set on the test steps: a run that skipped the gate did not pass it. The
      # artefact carries a caveat saying the eBPF capture path did not run, and
      # printing it here is what keeps that sentence from living only on the
      # machine that produced the file.
      - name: F3 gate proof
        env:
          PERISKOP_REQUIRE_PROOF: 1
        run: |
          cargo test -p periskop-cli --test proof_f3
          cat target/f3-proof.json

      # Two builds of the same tree must agree byte for byte.
      - name: Report is reproducible
        run: |
          FIX=crates/periskop-static-scanner/fixtures/python
          cargo run --quiet -p periskop-cli -- scan "$FIX" --rules rules --json > /tmp/a.json
          cargo run --quiet -p periskop-cli -- scan "$FIX" --rules rules --json > /tmp/b.json
          python3 -c "import json,sys; a=json.load(open('/tmp/a.json')); b=json.load(open('/tmp/b.json')); a.pop('envelope'); b.pop('envelope'); sys.exit(0 if a==b else 'two scans of the same tree disagreed')"

  # F4 exit criterion 1, and the only job in this file that can close it.
  #
  # Everything else here runs unprivileged, and the eBPF capture path cannot be
  # observed from there: it needs a kernel with BTF, a process holding CAP_BPF
  # and CAP_PERFMON, and a kernel side object that no macOS development machine
  # can build. ADR-014 deferred the loader three times partly on the belief that
  # no gate could ever see the code; K-28 measured a hosted runner and found that
  # belief wrong, and this job is what that measurement was for.
  #
  # It is deliberately fail closed. There is no `continue-on-error` and no
  # `|| true` anywhere in it (CLAUDE.md O6b): a run that cannot build the object,
  # cannot load the programs, or produces an artefact that does not say `proved`
  # fails the workflow. A phase criterion that a red job could leave green is a
  # criterion nobody is checking.
  kernel:
    name: Kernel capture (privileged Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Printed, not asserted. The assertions are in the Rust below; this is so
      # that a reader of a failed run can see what the machine offered without
      # rerunning anything. These are the same three facts the kernel-probe
      # workflow measured for K-28.
      - name: What this runner offers
        run: |
          uname -a
          echo "BTF: $(stat -c %s /sys/kernel/btf/vmlinux) bytes"
          grep -E 'CapEff' /proc/self/status
          sudo grep -E 'CapEff' /proc/self/status

      - uses: Swatinem/rust-cache@v2

      # The linker for the kernel target. It is not a cargo dependency of
      # anything: it is a host tool the object's build invokes, which is exactly
      # why ADR-014 §8 records it as a build time cost rather than as a
      # dependency of the shipped binary.
      - name: Install bpf-linker
        run: cargo install bpf-linker --locked

      # The toolchain comes from crates/periskop-ebpf-object/rust-toolchain.toml,
      # which pins a dated nightly separately from the workspace's stable pin.
      # rustup installs it on first use, and the version is printed so a failure
      # caused by moving that pin is visible in the log rather than inferred.
      - name: Build the kernel side object
        working-directory: crates/periskop-ebpf-object
        run: |
          rustc --version
          cargo build --release
          ls -l target/bpfel-unknown-none/release/periskop-ebpf-object

      # The object's existence is what makes the loader a loader. Checked here
      # rather than trusted, because every later step would otherwise fall back
      # to the honest-but-useless `loader_not_built` path and still report green.
      - name: The object exists and is not empty
        run: |
          OBJ="$PWD/crates/periskop-ebpf-object/target/bpfel-unknown-none/release/periskop-ebpf-object"
          test -s "$OBJ"
          echo "PERISKOP_EBPF_OBJECT=$OBJ" >> "$GITHUB_ENV"

      # The three gates, with the object compiled in, so this is the first place
      # in the repository where the loader's Linux code is compiled at all. The
      # development machine is macOS and never sees it (ADR-014 §8).
      - name: Formatting, lints and tests with the loader compiled in
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features -- --test-threads=4

      # The tests that need real authority. `--test-threads=1` is required and
      # not a preference: one of them drops this process's capabilities, which is
      # a change to the whole process, so a concurrent test would read them at an
      # unpredictable moment.
      #
      # Both packages, because the sensor carries one of these too: it has been
      # marked and unrunnable through three milestones waiting for a loader, and
      # this is the first job that can run it.
      - name: Loader tests that need a real kernel
        run: |
          sudo -E env "PATH=$PATH" cargo test -p periskop-ebpf-loader --all-features \
            -- --ignored --test-threads=1
          sudo -E env "PATH=$PATH" cargo test -p periskop-network-sensor --all-features \
            -- --ignored --test-threads=1
        env:
          RUSTFLAGS: -D warnings

      # The gate itself. PERISKOP_REQUIRE_KERNEL_PROOF is set only here, and it
      # turns every path in proof_f4_kernel.rs that would record a skip into a
      # failure.
      #
      # `--all-features` is load bearing and was missing for one run. Without it
      # cargo rebuilds `periskop-network-sensor` with `ebpf-loader` off, the test
      # binary carries no loader, and the gate reports `loader_not_built` on a
      # machine that has BTF, root and an object the kernel would have accepted.
      # The failure looked like a kernel problem and was a command line one.
      - name: F4 kernel gate
        run: |
          sudo -E env "PATH=$PATH" PERISKOP_REQUIRE_KERNEL_PROOF=1 \
            cargo test -p periskop-cli --all-features --test proof_f4_kernel
          cat target/f4-kernel-proof.json

      # A passing test is not the claim; the artefact is. This is the line that
      # makes a missing or downgraded artefact fail the job, so that a gate which
      # ran and could not prove anything cannot be read as one that did.
      - name: The artefact says proved
        run: |
          python3 - <<'CHECK'
          import json, sys
          path = "target/f4-kernel-proof.json"
          try:
              proof = json.load(open(path))
          except Exception as error:
              sys.exit(f"{path} was not produced or is not readable: {error}")
          if proof.get("status") != "proved":
              sys.exit(f"F4 exit criterion 1 is open: status={proof.get('status')!r}, reason={proof.get('reason')!r}")
          if proof.get("capture") != "ebpf":
              sys.exit(f"the observation did not come through eBPF: capture={proof.get('capture')!r}")
          if not proof.get("proves") or not proof.get("does_not_prove"):
              sys.exit("the artefact must state both what it proves and what it does not")
          evidence = proof.get("evidence") or {}
          if evidence.get("payload_marker_found_in_any_record"):
              sys.exit("payload reached a record")
          print(f"proved: {len(proof['proves'])} claims, {len(proof['does_not_prove'])} exclusions")
          CHECK

      - name: Publish the kernel proof
        uses: actions/upload-artifact@v4
        with:
          name: f4-kernel-proof
          path: target/f4-kernel-proof.json
          if-no-files-found: error

      # ADR-014 §5 requires this crate to have a separate miri or sanitiser
      # target, and it runs here rather than in the main Rust job because this is
      # the job that owns the crate. Unprivileged and without the object: miri
      # interprets rather than executes, so it cannot make a syscall, and what it
      # is worth running against is the record decoder, which reads bytes this
      # process did not write and is the one place an out of bounds read would
      # live.
      - name: Miri over the loader crate
        run: |
          rustup toolchain install nightly --component miri --profile minimal
          cargo +nightly miri test -p periskop-ebpf-loader --lib
        env:
          PERISKOP_EBPF_OBJECT: ""

  # The two hooks are the second detection source, and neither is compiled by
  # cargo. They carry their own blake3, written out because a hook may not add a
  # dependency to somebody else's interpreter, and the whole point of that code
  # is that python, node and the engine derive the same egress_event_id. Nothing
  # checks that unless these suites run.
  hooks-python:
    name: Python runtime hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The hook is pure standard library, so the runner's interpreter is the
      # dependency list. Printed because which one it was matters when a failure
      # is version specific. The declared floor is python 3.9 and this job does
      # not exercise it; that is a gap, not a claim.
      - name: Show interpreter
        run: python3 --version

      - name: Tests
        working-directory: hooks/python
        run: python3 -m unittest discover

  hooks-node:
    name: Node runtime hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hooks/node/package-lock.json

      - name: Install
        working-directory: hooks/node
        run: npm ci

      - name: Types
        working-directory: hooks/node
        run: npx tsc --noEmit

      - name: Build
        working-directory: hooks/node
        run: npx tsc

      # The suite runs against the emitted JavaScript rather than the sources,
      # which is what the interpreter loads through --require at run time.
      - name: Tests
        working-directory: hooks/node
        run: node --test dist/*.test.js

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      # The smoke tests drive the real binary, so the engine is built first.
      - name: Build the engine
        run: cargo build -p periskop-cli

      - name: Install
        working-directory: packages/mcp-server
        run: npm ci

      - name: Types
        working-directory: packages/mcp-server
        run: npx tsc --noEmit

      - name: Build
        working-directory: packages/mcp-server
        run: npx tsc

      # Both sides pass their own tests without agreeing on the wire. This is
      # where a renamed field or a framing mismatch surfaces.
      #
      # The glob is deliberate. Naming one file here meant that every suite
      # added later ran on a developer machine and nowhere else, which is the
      # same defect this project exists to report: a check that looks like it
      # covers something and does not.
      - name: Tests
        working-directory: packages/mcp-server
        run: node --test dist/*.test.js

      # Every contract under schemas/ has had an ajv gate from the start except
      # the MCP tool surface, which had only prose. Four deviations between
      # docs/04-contracts/mcp-tools.md and this package survived for months
      # because nothing compared them: a rule with no gate stays silent when it
      # is broken, which is the defect this product exists to report.
      #
      # The gate derives the surface from the real registerTool list and the real
      # handlers, then validates it against schemas/mcp-tools.schema.json. It is
      # its own step rather than one more file behind the test glob because a
      # gate has to say whether it ran. No --if-present and no || true: a missing
      # schema, an empty registry or an argument type the describer cannot state
      # all exit non zero rather than reporting green (CLAUDE.md O6b).
      - name: Tool surface matches the contract
        working-directory: packages/mcp-server
        run: npm run gate:contract
